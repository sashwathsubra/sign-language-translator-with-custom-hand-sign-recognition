services:
  - type: web
    name: slt-demo-backend
    env: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install -e . --no-deps
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ALLOWED_ORIGINS
        value: https://sashwathsubra.github.io
      - key: MAX_BUFFER_SIZE
        value: 16
      - key: IDLE_TIMEOUT_SECONDS
        value: 60
      - key: MAX_CONCURRENT_SESSIONS
        value: 32
