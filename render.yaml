services:
  - type: web
    name: slt-demo-backend
    env: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: https://sashwathsubra.github.io
      - key: MAX_BUFFER_SIZE
        value: 16
      - key: IDLE_TIMEOUT_SECONDS
        value: 60
      - key: MAX_CONCURRENT_SESSIONS
        value: 32
